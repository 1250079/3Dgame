
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON CITY BATTLE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111923;color:white;font-family:Arial,sans-serif}
canvas{display:block}
button{cursor:pointer;font:inherit}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.panel{background:#101b2be8;border:1px solid #8298b566;border-radius:10px;padding:11px 14px;min-width:180px}
.name{font-size:13px;font-weight:bold;margin-bottom:7px}
.bar{height:11px;background:#344052;border-radius:10px;overflow:hidden}
.fill{height:100%;width:100%;background:#36e4a0;transition:width .15s}
#cpuFill{background:#ff6681}
.hp,.score{font-size:12px;margin-top:5px}
.hp{color:#d4deeb}.score{color:#f8d777}
#message{position:fixed;top:23%;left:50%;transform:translateX(-50%);font-size:clamp(22px,4vw,38px);font-weight:900;text-shadow:0 2px 14px #000;pointer-events:none;text-align:center}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#101b2be8;border:1px solid #8298b544;border-radius:9px;text-align:center;font-size:12px;line-height:1.8;white-space:nowrap;pointer-events:none}
#crosshair{position:fixed;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white;box-shadow:0 0 3px #000}
#crosshair:before{width:2px;height:14px;left:6px}
#crosshair:after{height:2px;width:14px;top:6px}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:auto;background:#07111bea}
.card{width:min(620px,94vw);max-height:96vh;overflow:auto;padding:22px;background:#111e30f5;border:1px solid #8ba8c655;border-radius:17px;text-align:center}
h1{margin:4px 0;color:#d9e8f5;letter-spacing:2px;font-size:clamp(26px,5vw,40px)}
.subtitle{color:#a9bbce;font-size:13px;margin:8px 0 15px}
#characterSelect{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.characterCard{padding:12px 6px 14px;background:#19283b;color:#fff;border:2px solid #43546b;border-radius:12px;min-width:0}
.characterCard.selected{border-color:#6ce7ff;background:#1c354b;box-shadow:0 0 18px #55dfff22}
.preview{height:75px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.person{width:34px;height:43px;border-radius:13px 13px 8px 8px;position:relative;box-shadow:0 0 17px currentColor}
.person:before{content:"";position:absolute;width:22px;height:22px;left:6px;top:-21px;background:#d5c8b8;border-radius:50%}
.person:after{content:"";position:absolute;width:50px;height:9px;left:-8px;bottom:1px;background:currentColor;border-radius:8px}
.characterCard strong{font-size:14px;display:block}
.characterCard small{display:block;margin-top:6px;color:#b9cadb;font-size:11px;line-height:1.7}
.tag{font-size:10px;color:#80e8f8;margin-top:6px}
#start{width:100%;padding:14px;border:0;border-radius:9px;background:#d8e7f4;color:#142235;font-weight:bold;font-size:17px}
.note{font-size:11px;color:#9bacc0;line-height:1.8}
@media(max-width:500px){
 .panel{min-width:0;width:47%;padding:9px}
 #help{font-size:10px;white-space:normal;width:94%}
 .characterCard small{font-size:10px}
 .card{padding:14px}
}
</style>
</head>
<body>

<div id="hud">
  <div class="panel">
    <div class="name" id="playerName">PLAYER</div>
    <div class="bar"><div id="playerFill" class="fill"></div></div>
    <div class="hp" id="playerHP">HP 100 / 100</div>
    <div class="score" id="playerScore">クリスタル 0 / 10</div>
  </div>
  <div class="panel">
    <div class="name">CPU TEAM · 3 ENEMIES</div>
    <div class="bar"><div id="cpuFill" class="fill"></div></div>
    <div class="hp" id="cpuHP">HP 100 / 100</div>
    <div class="score" id="cpuScore">クリスタル 0 / 10</div>
  </div>
</div>

<div id="message"></div>
<div id="crosshair"></div>
<div id="help">
WASD：移動　｜　マウス：視点　｜　Space：ジャンプ<br>
クリック / E：光の弾　｜　クリスタル10個または敵チームHPを0にすると勝利
</div>

<div id="overlay">
 <div class="card">
  <h1>NEON CITY</h1>
  <div class="subtitle">3D URBAN ARENA · CHARACTER SELECT</div>
  <div style="text-align:left;font-size:14px">キャラクターを選択</div>
  <div id="characterSelect">
   <button class="characterCard selected" data-character="speed">
    <div class="preview"><div class="person" style="background:#278aff;color:#278aff"></div></div>
    <strong>スピード</strong>
    <small>移動：速い<br>攻撃：標準</small>
    <div class="tag">SPEED TYPE</div>
   </button>
   <button class="characterCard" data-character="balance">
    <div class="preview"><div class="person" style="background:#35d9a0;color:#35d9a0"></div></div>
    <strong>バランス</strong>
    <small>移動：標準<br>攻撃：標準</small>
    <div class="tag">BALANCED TYPE</div>
   </button>
   <button class="characterCard" data-character="power">
    <div class="preview"><div class="person" style="background:#bb83ff;color:#bb83ff"></div></div>
    <strong>パワー</strong>
    <small>移動：遅い<br>攻撃：強い</small>
    <div class="tag">POWER TYPE</div>
   </button>
  </div>
  <button id="start">ゲームスタート</button>
  <p class="note">CPUは3体。障害物を利用して戦おう。<br>ゲーム画面をクリックするとマウス視点が有効になります。</p>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

// =================================
// 1. Three.js 基本設定
// =================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9baebd);
scene.fog = new THREE.Fog(0x9baebd, 65, 145);

const camera = new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,220);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9eaff,0x52535a,2.1));

const sun = new THREE.DirectionalLight(0xffe6c5,3);
sun.position.set(-25,45,20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;
sun.shadow.camera.right=65;
sun.shadow.camera.top=65;
sun.shadow.camera.bottom=-65;
scene.add(sun);

// =================================
// 2. 表面テクスチャ
// =================================
function noiseTexture(base,count=4500,seed=3){
 const c=document.createElement('canvas');
 c.width=256;c.height=256;
 const ctx=c.getContext('2d');
 ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
 let s=seed;
 function rand(){
  s=(s*1664525+1013904223)>>>0;
  return s/4294967296;
 }
 for(let i=0;i<count;i++){
  const v=Math.floor(rand()*90+40);
  ctx.fillStyle=`rgba(${v},${v},${v},${rand()*.22})`;
  const size=rand()*2.5+.3;
  ctx.fillRect(rand()*256,rand()*256,size,size);
 }
 const tex=new THREE.CanvasTexture(c);
 tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
 tex.colorSpace=THREE.SRGBColorSpace;
 return tex;
}

function windowTexture(){
 const c=document.createElement('canvas');
 c.width=256;c.height=512;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#303b47';ctx.fillRect(0,0,256,512);
 for(let row=0;row<12;row++){
  for(let col=0;col<5;col++){
   const lit=Math.random();
   ctx.fillStyle=lit>.66?'#c9bd91':lit>.3?'#486478':'#172d40';
   ctx.fillRect(12+col*49,12+row*41,35,28);
  }
 }
 for(let col=0;col<5;col++){
  ctx.fillStyle='#45515d';
  ctx.fillRect(col*51,0,5,512);
 }
 const tex=new THREE.CanvasTexture(c);
 tex.colorSpace=THREE.SRGBColorSpace;
 tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
 return tex;
}

const asphaltTex=noiseTexture('#343a40',7000,1);
asphaltTex.repeat.set(8,8);
const concreteTex=noiseTexture('#8b8b84',5000,2);
concreteTex.repeat.set(3,3);
const facadeTex=noiseTexture('#7a8187',3000,4);
facadeTex.repeat.set(2,4);
const glassTex=windowTexture();

const asphalt=new THREE.MeshStandardMaterial({map:asphaltTex,roughness:.95});
const concrete=new THREE.MeshStandardMaterial({map:concreteTex,roughness:.9});
const facade=new THREE.MeshStandardMaterial({map:facadeTex,roughness:.85});
const glass=new THREE.MeshStandardMaterial({
 map:glassTex,color:0xc1d6e2,metalness:.35,roughness:.35
});
const darkMetal=new THREE.MeshStandardMaterial({
 color:0x303943,metalness:.7,roughness:.4
});
const roadPaint=new THREE.MeshStandardMaterial({color:0xe3dfd2,roughness:.8});
const neonBlue=new THREE.MeshStandardMaterial({
 color:0x54dfff,emissive:0x087ca0,emissiveIntensity:1.4
});
const neonPink=new THREE.MeshStandardMaterial({
 color:0xff78c9,emissive:0x861c5c,emissiveIntensity:1.2
});
const crystalMat=new THREE.MeshStandardMaterial({
 color:0x6bffe1,emissive:0x05a78b,emissiveIntensity:2,
 metalness:.3,roughness:.2
});

const solids=[];
const pickups=[];
const pulses=[];
const keys={};
let gameStarted=false,gameOver=false,locked=false;
let playerHP=100,cpuHP=100,playerScore=0,cpuScore=0;
let selectedCharacter='speed',playerSpeed=10,playerDamage=25;
let yaw=0,pitch=0,jumpV=0,onGround=true,lastShot=0;
const clock=new THREE.Clock();

// =================================
// 3. 物体を作る関数
// =================================
function box(w,h,d,mat,x,y,z,solid=false,cast=true){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=cast;
 mesh.receiveShadow=true;
 scene.add(mesh);
 if(solid)solids.push({mesh,w,h,d});
 return mesh;
}

// =================================
// 4. 都市の地面・道路
// =================================
box(120,.5,120,concrete,0,-.4,0);
box(120,.12,24,asphalt,0,-.08,0);
box(24,.12,120,asphalt,0,-.07,0);

for(let i=-55;i<=55;i+=8){
 box(.16,.025,3,roadPaint,0,.0,i,false,false);
 box(3,.025,.16,roadPaint,i,.01,0,false,false);
}

for(const p of [-15,15]){
 box(120,.24,5,concrete,0,-.01,p);
 box(5,.24,120,concrete,p,-.01,0);
}

for(const z of [-5,5]){
 for(let i=-10;i<=10;i+=2){
  box(1.1,.03,2,roadPaint,i,.02,z,false,false);
 }
}
for(const x of [-5,5]){
 for(let i=-10;i<=10;i+=2){
  box(2,.03,1.1,roadPaint,x,.025,i,false,false);
 }
}

for(const z of [-12.3,12.3])box(120,.32,.35,facade,0,.02,z);
for(const x of [-12.3,12.3])box(.35,.32,120,facade,x,.02,0);

// =================================
// 5. ビル
// =================================
function building(x,z,w,d,h,style=0){
 const material=style%3===0?facade:style%3===1?glass:
  new THREE.MeshStandardMaterial({color:0x8e9294,roughness:.85});

 box(w,h,d,material,x,h/2,z,true);
 box(w+.3,.35,d+.3,darkMetal,x,h+.12,z);
 box(w*.28,.9,d*.28,darkMetal,x,h+.7,z,true);
 box(w*.14,.25,d*.14,facade,x+w*.2,h+1.25,z-d*.1);

 const cols=Math.max(2,Math.floor(w/1.6));
 const rows=Math.min(15,Math.floor(h/2.3));

 for(let r=0;r<rows;r++){
  for(let col=0;col<cols;col++){
   const wx=x-w/2+(col+.5)*w/cols;
   const wy=1.1+r*2.2;
   if(wy>h-.5)continue;
   box(w/cols*.55,1.25,.045,glass,wx,wy,z-d/2-.035,false,false);
  }
 }

 const sign=style%2?neonPink:neonBlue;
 box(Math.min(w*.65,4),.65,.13,darkMetal,x,h*.58,z-d/2-.1);
 box(Math.min(w*.56,3.4),.09,.16,sign,x,h*.58,z-d/2-.19,false,false);
 box(.12,h*.8,.12,sign,x-w/2-.05,h*.52,z-d/2-.06,false,false);
}

const buildingList=[
 [-25,-25,10,10,23,0],[-39,-26,9,9,15,1],[-26,-40,9,9,18,2],
 [25,-25,10,10,27,1],[39,-26,9,9,17,0],[26,-40,9,9,21,2],
 [-25,25,10,10,20,2],[-39,26,9,9,26,1],[-26,40,9,9,16,0],
 [25,25,10,10,24,0],[39,26,9,9,18,2],[26,40,9,9,29,1],
 [-8,-35,7,8,15,0],[8,-35,7,8,20,2],
 [-8,35,7,8,17,1],[8,35,7,8,22,0],
 [-40,0,8,9,21,2],[40,0,8,9,25,1],
 [0,-42,9,8,18,1],[0,42,9,8,20,2]
];
buildingList.forEach(b=>building(...b));

// =================================
// 6. 障害物を大量に配置
// =================================
function barrier(x,z,w,d,h=1.2){
 box(w,h,d,darkMetal,x,h/2,z,true);
 box(w,.12,.12,neonBlue,x,h+.06,z-d/2,false,false);
}

const barriers=[
 [-10,-8,2.8,.8,1.2],[10,8,2.8,.8,1.2],
 [-8,10,.8,2.8,1.2],[8,-10,.8,2.8,1.2],
 [-19,0,2.5,.8,1.2],[19,0,2.5,.8,1.2],
 [-6,-13,2.5,1.8,1.8],[6,13,2.5,1.8,1.8],
 [-13,6,1.8,2.5,1.6],[13,-6,1.8,2.5,1.6],
 [-18,-9,2.5,2.5,1.4],[18,9,2.5,2.5,1.4],
 [-9,18,3,1.5,1.2],[9,-18,3,1.5,1.2],
 [-21,5,2,2,2],[21,-5,2,2,2],
 [-5,-21,2,2,1.5],[5,21,2,2,1.5],
 [-16,-15,3,1,1.1],[16,15,3,1,1.1],
 [-15,16,1,3,1.3],[15,-16,1,3,1.3],
 [-4,18,2.5,2,1.5],[4,-18,2.5,2,1.5],
 [-22,-12,3,1,1.2],[22,12,3,1,1.2],
 [-12,22,1,3,1.3],[12,-22,1,3,1.3]
];
for(const [x,z,w,d,h] of barriers)barrier(x,z,w,d,h);

// 箱・コンクリートブロック
const crateMat=new THREE.MeshStandardMaterial({color:0x76634e,roughness:.92});
const blockMat=new THREE.MeshStandardMaterial({color:0x777e84,roughness:.95});
const crates=[
 [-4,12],[4,-12],[-11,-17],[11,17],[-20,9],[20,-9],
 [-7,21],[7,-21],[-22,-5],[22,5],[-14,3],[14,-3]
];
for(const [x,z] of crates){
 box(1.4,1.4,1.4,crateMat,x,.7,z,true);
 box(1.46,.1,1.46,darkMetal,x,1.42,z);
}
const blocks=[
 [-3,-16],[3,16],[-17,4],[17,-4],[-21,13],[21,-13],
 [-13,-21],[13,21],[-5,8],[5,-8]
];
for(const [x,z] of blocks){
 box(1.8,1.8,1.8,blockMat,x,.9,z,true);
}

// =================================
// 7. 街灯・ベンチ・木
// =================================
function streetlight(x,z){
 box(.13,4.5,.13,darkMetal,x,2.25,z,true);
 box(.8,.12,.35,darkMetal,x+.3,4.45,z);
 const lamp=new THREE.Mesh(new THREE.BoxGeometry(.65,.12,.25),
  new THREE.MeshStandardMaterial({
   color:0xffe5ae,emissive:0xffd18a,emissiveIntensity:2
  }));
 lamp.position.set(x+.3,4.35,z);
 scene.add(lamp);
 const light=new THREE.PointLight(0xffd8a1,2,8);
 light.position.set(x,4.2,z);
 scene.add(light);
}
for(const p of [-20,20]){
 for(const q of [-8,0,8])streetlight(p,q);
 for(const q of [-8,0,8])streetlight(q,p);
}

function bench(x,z){
 box(2,.15,.65,darkMetal,x,.65,z,true);
 box(2,.65,.12,darkMetal,x,1,z-.25,true);
 for(const dx of [-.7,.7]){
  box(.12,.6,.12,darkMetal,x+dx,.3,z,true);
 }
}
bench(-8,-8);bench(8,8);

function tree(x,z){
 box(2,.35,2,facade,x,.15,z);
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.17,.25,1.7,8),
  new THREE.MeshStandardMaterial({color:0x66503d,roughness:1})
 );
 trunk.position.set(x,1,z);scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.15,10,8),
  new THREE.MeshStandardMaterial({color:0x436f53,roughness:1})
 );
 leaves.position.set(x,2.25,z);
 leaves.castShadow=true;
 scene.add(leaves);
}
for(const [x,z] of [[-8,-5],[-8,5],[8,-5],[8,5]])tree(x,z);

// =================================
// 8. キャラクター生成
// =================================
function makeCharacter(color,glow,x,z){
 const g=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({
  color,metalness:.35,roughness:.4,emissive:glow,emissiveIntensity:.15
 });
 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(.42,.85,5,10),bodyMat
 );
 body.position.y=1.05;body.castShadow=true;g.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.29,16,12),
  new THREE.MeshStandardMaterial({color:0xb9c4ce,metalness:.2,roughness:.6})
 );
 head.position.y=1.9;head.castShadow=true;g.add(head);

 const visor=new THREE.Mesh(
  new THREE.BoxGeometry(.4,.12,.16),
  new THREE.MeshStandardMaterial({
   color:glow,emissive:glow,emissiveIntensity:1.5,metalness:.4,roughness:.2
  })
 );
 visor.position.set(0,1.93,-.23);g.add(visor);

 for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.55,.25),darkMetal);
  leg.position.set(side*.18,.38,0);leg.castShadow=true;g.add(leg);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.19,.65,.22),bodyMat);
  arm.position.set(side*.52,1.1,0);arm.castShadow=true;g.add(arm);
 }

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.58,.045,6,24),
  new THREE.MeshStandardMaterial({color:glow,emissive:glow,emissiveIntensity:1.2})
 );
 ring.rotation.x=Math.PI/2;ring.position.y=.08;g.add(ring);
 g.position.set(x,0,z);
 scene.add(g);
 g.userData={body,head,ring,visor,lastShot:0};
 return g;
}

const player=makeCharacter(0x278aff,0x2edcff,0,6);
const cpus=[
 makeCharacter(0xff486b,0xff244c,-17,-17),
 makeCharacter(0xffa63d,0xff7a20,17,-17),
 makeCharacter(0xc27bff,0xa44cff,0,-25)
];

// =================================
// 9. クリスタル
// =================================
const crystalSpots=[
 [-17,-7],[-10,9],[10,9],[17,-7],[0,16],
 [0,-16],[-19,8],[19,-8],[-8,-19],[8,19],
 [-20,0],[20,0],[0,21],[0,-22]
];

function spawnCrystal(x,z){
 const g=new THREE.Group();
 const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.48),crystalMat);
 gem.castShadow=true;g.add(gem);
 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.55,.65,.12,12),
  new THREE.MeshStandardMaterial({color:0x263443,metalness:.6,roughness:.35})
 );
 base.position.y=-.5;g.add(base);
 g.position.set(x,.95,z);
 scene.add(g);
 pickups.push({mesh:g,x,z,active:true,phase:Math.random()*6});
}
crystalSpots.forEach(p=>spawnCrystal(...p));

// =================================
// 10. 衝突判定
// =================================
function clampPosition(obj){
 obj.position.x=THREE.MathUtils.clamp(obj.position.x,-53,53);
 obj.position.z=THREE.MathUtils.clamp(obj.position.z,-53,53);
}
function hitsSolid(x,z,r=.55){
 for(const s of solids){
  const p=s.mesh.position;
  if(p.y-s.h/2>1.7)continue;
  if(Math.abs(x-p.x)<s.w/2+r && Math.abs(z-p.z)<s.d/2+r)return true;
 }
 return false;
}
function moveWithCollision(obj,dx,dz){
 const nx=obj.position.x+dx;
 const nz=obj.position.z+dz;
 if(!hitsSolid(nx,obj.position.z))obj.position.x=nx;
 if(!hitsSolid(obj.position.x,nz))obj.position.z=nz;
 clampPosition(obj);
}

// =================================
// 11. 入力
// =================================
document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='Space'&&gameStarted&&!gameOver&&onGround){
  jumpV=7.5;onGround=false;
 }
 if(e.code==='KeyE'&&gameStarted&&!gameOver)firePulse(player,true);
});
document.addEventListener('keyup',e=>keys[e.code]=false);

document.addEventListener('mousemove',e=>{
 if(!locked||!gameStarted||gameOver)return;
 yaw-=e.movementX*.0024;
 pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.15,1.15);
});

document.addEventListener('pointerlockchange',()=>{
 locked=document.pointerLockElement===renderer.domElement;
});

renderer.domElement.addEventListener('click',()=>{
 if(!gameStarted||gameOver)return;
 if(!locked)renderer.domElement.requestPointerLock?.();
 else firePulse(player,true);
});

// =================================
// 12. 光の弾
// =================================
function firePulse(from,isPlayer){
 const now=performance.now();
 if(isPlayer&&now-lastShot<420)return;
 if(!isPlayer&&now-from.userData.lastShot<1500)return;

 if(isPlayer)lastShot=now;
 else from.userData.lastShot=now;

 // プレイヤーは視点方向へ発射
 const start=from.position.clone();
 start.y+=1.3;

 let dir;
 if(isPlayer){
  dir=new THREE.Vector3(
   -Math.sin(yaw)*Math.cos(pitch),
   Math.sin(pitch),
   -Math.cos(yaw)*Math.cos(pitch)
  ).normalize();
 }else{
  const target=player.position.clone();
  target.y+=1.15;

  // CPUは照準を大きく外しやすい
  const distance=start.distanceTo(target);
  const miss=2+Math.random()*4+distance*.16;
  target.x+=(Math.random()-.5)*miss*2;
  target.z+=(Math.random()-.5)*miss*2;
  dir=target.sub(start).normalize();
 }

 const mat=new THREE.MeshBasicMaterial({
  color:isPlayer?0x6af6ff:0xff638b
 });
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),mat);
 mesh.position.copy(start);
 scene.add(mesh);

 pulses.push({
  mesh,dir,owner:isPlayer?'player':'cpu',life:0
 });
}

function updatePulses(dt){
 for(let i=pulses.length-1;i>=0;i--){
  const p=pulses[i];
  p.life+=dt;
  p.mesh.position.addScaledVector(p.dir,dt*28);

  // CPUの弾はプレイヤーに、プレイヤーの弾はどれかのCPUに当たる
  const targets=p.owner==='player'?cpus:[player];
  let hitTarget=null;

  for(const target of targets){
   const targetPos=new THREE.Vector3(
    target.position.x,target.position.y+1.1,target.position.z
   );
   if(p.mesh.position.distanceTo(targetPos)<1){
    hitTarget=target;break;
   }
  }

  if(hitTarget){
   if(p.owner==='player')cpuHP=Math.max(0,cpuHP-playerDamage);
   else playerHP=Math.max(0,playerHP-10);
   scene.remove(p.mesh);
   pulses.splice(i,1);
   continue;
  }

  // 障害物に当たった弾は消える
  if(hitsSolid(p.mesh.position.x,p.mesh.position.z,.12)){
   scene.remove(p.mesh);
   pulses.splice(i,1);
   continue;
  }

  if(p.life>2.2){
   scene.remove(p.mesh);
   pulses.splice(i,1);
  }
 }
}

// =================================
// 13. キャラクター選択
// =================================
const stats={
 speed:{speed:12,damage:25,color:0x278aff,glow:0x2edcff,name:'SPEED'},
 balance:{speed:9,damage:25,color:0x35d9a0,glow:0x13ff9c,name:'BALANCE'},
 power:{speed:7,damage:40,color:0xbb83ff,glow:0xa44cff,name:'POWER'}
};

document.querySelectorAll('.characterCard').forEach(button=>{
 button.addEventListener('click',()=>{
  selectedCharacter=button.dataset.character;
  document.querySelectorAll('.characterCard').forEach(card=>{
   card.classList.toggle('selected',card===button);
  });
 });
});

function applyCharacter(){
 const s=stats[selectedCharacter];
 playerSpeed=s.speed;
 playerDamage=s.damage;

 player.userData.body.material.color.setHex(s.color);
 player.userData.body.material.emissive.setHex(s.glow);
 player.userData.ring.material.color.setHex(s.glow);
 player.userData.ring.material.emissive.setHex(s.glow);
 player.userData.visor.material.color.setHex(s.glow);
 player.userData.visor.material.emissive.setHex(s.glow);

 document.getElementById('playerName').textContent='PLAYER — '+s.name;
}

// =================================
// 14. CPU AI
// =================================
const cpuTimers=[0,.6,1.1];

function updateCPU(dt){
 cpus.forEach((cpu,i)=>{
  const dx=player.position.x-cpu.position.x;
  const dz=player.position.z-cpu.position.z;
  const dist=Math.hypot(dx,dz);

  if(dist>4){
   const speed=dist>14?3.2:2;
   moveWithCollision(
    cpu,dx/dist*speed*dt,dz/dist*speed*dt
   );
  }

  cpu.rotation.y=Math.atan2(dx,dz);
  cpuTimers[i]+=dt;

  if(dist<24&&cpuTimers[i]>1.7+i*.45){
   firePulse(cpu,false);
   cpuTimers[i]=0;
  }
 });
}

// =================================
// 15. HUD・勝敗
// =================================
function updateHUD(){
 document.getElementById('playerFill').style.width=playerHP+'%';
 document.getElementById('cpuFill').style.width=cpuHP+'%';
 document.getElementById('playerHP').textContent=`HP ${playerHP} / 100`;
 document.getElementById('cpuHP').textContent=`チームHP ${cpuHP} / 100`;
 document.getElementById('playerScore').textContent=`クリスタル ${playerScore} / 10`;
 document.getElementById('cpuScore').textContent=`クリスタル ${cpuScore} / 10`;
}

function endGame(winner){
 if(gameOver)return;
 gameOver=true;
 document.exitPointerLock?.();
 document.getElementById('overlay').style.display='flex';
 document.querySelector('#overlay h1').textContent=
  winner==='player'?'YOU WIN!':winner==='cpu'?'CPU WINS':'DRAW';
 document.querySelector('#overlay .subtitle').textContent=
  winner==='player'?'都市のバトルに勝利！':
  winner==='cpu'?'CPUチームに負けた。もう一度挑戦！':'引き分け！';
 document.getElementById('characterSelect').style.display='none';
 document.getElementById('start').textContent='もう一度プレイ';
}

function checkEnd(){
 if(playerHP<=0)endGame('cpu');
 else if(cpuHP<=0)endGame('player');
 else if(playerScore>=10&&cpuScore>=10)endGame('draw');
 else if(playerScore>=10)endGame('player');
 else if(cpuScore>=10)endGame('cpu');
}

// =================================
// 16. ゲームループ
// =================================
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=performance.now()*.001;

 for(const p of pickups){
  if(!p.active)continue;
  p.mesh.rotation.y+=dt*.8;
  p.mesh.position.y=.95+Math.sin(t*2+p.phase)*.13;
 }

 if(gameStarted&&!gameOver){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let dx=0,dz=0;

  if(keys.KeyW||keys.ArrowUp){dx+=forward.x;dz+=forward.z}
  if(keys.KeyS||keys.ArrowDown){dx-=forward.x;dz-=forward.z}
  if(keys.KeyD||keys.ArrowRight){dx+=right.x;dz+=right.z}
  if(keys.KeyA||keys.ArrowLeft){dx-=right.x;dz-=right.z}

  const len=Math.hypot(dx,dz);
  if(len>0){
   moveWithCollision(player,dx/len*playerSpeed*dt,dz/len*playerSpeed*dt);
  }

  if(!onGround){
   player.position.y+=jumpV*dt;
   jumpV-=19*dt;
   if(player.position.y<=0){
    player.position.y=0;
    jumpV=0;
    onGround=true;
   }
  }

  player.rotation.y=yaw;
  updateCPU(dt);
  updatePulses(dt);

  for(const p of pickups){
   if(!p.active)continue;

   if(Math.hypot(player.position.x-p.x,player.position.z-p.z)<1.45){
    p.active=false;
    scene.remove(p.mesh);
    playerScore++;
    continue;
   }

   const taken=cpus.some(cpu=>
    Math.hypot(cpu.position.x-p.x,cpu.position.z-p.z)<1.45
   );

   if(taken){
    p.active=false;
    scene.remove(p.mesh);
    cpuScore++;
   }
  }

  updateHUD();
  checkEnd();
 }

 camera.position.set(
  player.position.x,
  player.position.y+1.58,
  player.position.z
 );
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 renderer.render(scene,camera);
}
animate();

// =================================
// 17. 開始・リスタート
// =================================
document.getElementById('start').addEventListener('click',()=>{
 if(gameOver){
  location.reload();
  return;
 }

 applyCharacter();
 gameStarted=true;
 document.getElementById('overlay').style.display='none';
 document.getElementById('message').textContent='FIGHT!';
 renderer.domElement.requestPointerLock?.();

 setTimeout(()=>{
  if(document.getElementById('message').textContent==='FIGHT!'){
   document.getElementById('message').textContent='';
  }
 },1600);
});

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updateHUD();
</script>
</body>
</html>
