
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON CITY BATTLE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07101d;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.panel{background:#081426dd;border:1px solid #4ce9ff88;border-radius:12px;padding:12px 15px;min-width:180px;box-shadow:0 0 15px #00cfff22}
.name{font-weight:bold;margin-bottom:6px}
.bar{width:180px;max-width:35vw;height:12px;background:#263449;border-radius:8px;overflow:hidden}
.fill{height:100%;width:100%;background:#40f5a4;transition:width .15s}
#cpuFill{background:#ff5f8f}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#081426dd;padding:10px 16px;border-radius:10px;text-align:center;font-size:13px;line-height:1.8;pointer-events:none;white-space:nowrap}
#message{position:fixed;top:24%;left:50%;transform:translateX(-50%);font-size:clamp(20px,4vw,38px);font-weight:bold;text-shadow:0 0 16px #00dfff;pointer-events:none;text-align:center}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030817cc;z-index:5}
.card{width:min(440px,90vw);padding:28px;background:#0b1830f5;border:1px solid #45eaff;border-radius:18px;text-align:center;box-shadow:0 0 45px #00cfff33}
h1{color:#65f2ff;line-height:1.2}
button{background:#43e9ff;color:#03101d;border:0;border-radius:10px;padding:13px 24px;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}
.small{color:#b6cbe0;font-size:13px;line-height:1.8}
#stats{margin-top:6px;font-size:13px;color:#b6d7ec}
</style>
</head>
<body>
<div id="hud">
  <div class="panel">
    <div class="name">🔵 PLAYER</div>
    <div class="bar"><div id="playerFill" class="fill"></div></div>
    <div id="playerHP">HP 100 / 100</div>
    <div id="playerScore">クリスタル 0 / 10</div>
  </div>
  <div class="panel">
    <div class="name">🔴 CITY CPU</div>
    <div class="bar"><div id="cpuFill" class="fill"></div></div>
    <div id="cpuHP">HP 100 / 100</div>
    <div id="cpuScore">クリスタル 0 / 10</div>
  </div>
</div>

<div id="message">NEON CITY</div>
<div id="help">WASD：移動　｜　マウス：視点　｜　Space：ジャンプ<br>クリック / E：タグパルス　｜　クリスタルを集めて10個で勝利</div>

<div id="overlay">
  <div class="card">
    <h1>NEON CITY<br>BATTLE 3D</h1>
    <p>ネオンが輝く未来都市でCPUと対戦しよう！</p>
    <p class="small">
      街を走り回ってクリスタルを集めよう。<br>
      タグパルスを当てると相手のHPが減るよ。<br>
      クリスタル10個、または相手のHPを0にすると勝利！
    </p>
    <button id="start">ゲームスタート</button>
    <p class="small">PC・Chromebook向け</p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x081426);
scene.fog = new THREE.Fog(0x081426, 35, 100);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bdcff,0x20253d,2));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(15,35,10);
sun.castShadow = true;
scene.add(sun);

const mats = {
 road:new THREE.MeshStandardMaterial({color:0x222b3a,roughness:.9}),
 sidewalk:new THREE.MeshStandardMaterial({color:0x687789,roughness:.8}),
 white:new THREE.MeshStandardMaterial({color:0xd8e7f5}),
 glass:new THREE.MeshStandardMaterial({color:0x173b5c,metalness:.45,roughness:.25}),
 dark:new THREE.MeshStandardMaterial({color:0x101a2d,metalness:.4,roughness:.5}),
 blue:new THREE.MeshStandardMaterial({color:0x11dfff,emissive:0x057bba,emissiveIntensity:2}),
 pink:new THREE.MeshStandardMaterial({color:0xff4fbd,emissive:0xa60069,emissiveIntensity:2}),
 gold:new THREE.MeshStandardMaterial({color:0xffd65c,emissive:0x997000,emissiveIntensity:1.5}),
 green:new THREE.MeshStandardMaterial({color:0x37eea3,emissive:0x087a47,emissiveIntensity:1.5})
};

const solids = [];
const pickups = [];
const pulses = [];
const decorations = [];
let gameStarted=false, gameOver=false, locked=false;
let playerHP=100,cpuHP=100,playerScore=0,cpuScore=0;
let jumpV=0, onGround=true, lastShot=0, cpuLastShot=0;
const keys={};
const clock=new THREE.Clock();

function box(w,h,d,mat,x,y,z,solid=false){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);
 if(solid) solids.push({mesh:m,w,h,d});
 return m;
}

// 道路・街区
box(100,.4,100,mats.road,0,-.25,0);
for(let x=-45;x<=45;x+=10){
 box(1,.02,100,mats.white,x,.01,0);
}
for(let z=-45;z<=45;z+=10){
 box(100,.02,1,mats.white,0,.012,z);
}

// 交差点の横断歩道
for(const z of [-12,12]){
 for(let i=-5;i<=5;i++){
  box(.9,.035,5,mats.white,i*1.4,.03,z);
 }
}
for(const x of [-12,12]){
 for(let i=-5;i<=5;i++){
  box(5,.035,.9,mats.white,x,.035,i*1.4);
 }
}

// 歩道の帯
for(let z of [-22,22]) box(100,.25,3,mats.sidewalk,0,.05,z);
for(let x of [-22,22]) box(3,.25,100,mats.sidewalk,x,.05,0);

// 中央の広場
box(13,.25,13,mats.sidewalk,0,.05,0);
box(5,.4,5,mats.dark,0,.35,0,true);
const plazaRing = new THREE.Mesh(
 new THREE.TorusGeometry(3.5,.09,8,48),
 mats.blue
);
plazaRing.rotation.x=Math.PI/2;
plazaRing.position.y=.7;
scene.add(plazaRing);

// ビル用の窓マテリアル
const windowMats=[
 new THREE.MeshStandardMaterial({color:0x183957,emissive:0x071f39,emissiveIntensity:1}),
 new THREE.MeshStandardMaterial({color:0x24496a,emissive:0x102c48,emissiveIntensity:1}),
 new THREE.MeshStandardMaterial({color:0x4b315f,emissive:0x241039,emissiveIntensity:1})
];

function makeBuilding(x,z,w,d,h,variant=0){
 const baseY=h/2;
 const body=box(w,h,d,windowMats[variant%windowMats.length],x,baseY,z,true);
 // 屋上の縁取り
 box(w+.25,.22,d+.25,mats.dark,x,h+.08,z);
 box(w+.4,.12,.12,variant%2?mats.pink:mats.blue,x,h+.18,z-d/2);
 box(.12,.12,d+.4,mats.blue,x-w/2,h+.18,z);
 // 屋上設備
 box(w*.25,.6,d*.25,mats.dark,x,h+.45,z,true);
 // 窓の列
 const rows=Math.min(9,Math.floor(h/2.1));
 for(let row=0;row<rows;row++){
  const y=1.1+row*2;
  for(let col=0;col<Math.max(1,Math.floor(w/1.5));col++){
   const wx=x-w/2+.75+col*1.5;
   if(wx<x+w/2-.2 && y<h-.4){
    const wm=Math.random()<.3?mats.gold:(Math.random()<.5?mats.blue:mats.pink);
    box(.65,.9,.07,wm,wx,y,z-d/2-.04);
    box(.07,.9,.65,wm,x+w/2+.04,y,z-d/2+1+col%2);
   }
  }
 }
 // ネオン看板
 const signMat=variant%2?mats.pink:mats.blue;
 box(Math.min(w*.8,4),.55,.15,mats.dark,x,h*.55,z-d/2-.12);
 box(Math.min(w*.72,3.5),.08,.18,signMat,x,h*.55,z-d/2-.22);
 return body;
}

// 建物は道路の両側に配置。中央通路は広く空ける。
const buildings=[
 [-31,-31,8,8,15],[-19,-32,7,8,22],[-35,-18,7,8,19],
 [-31,31,9,8,24],[-18,33,7,8,14],[-34,19,8,7,18],
 [31,-31,8,8,23],[19,-33,7,7,16],[34,-18,8,8,20],
 [31,31,8,8,18],[19,33,7,8,25],[34,19,8,7,15],
 [-7,-34,7,8,12],[7,-34,7,8,18],[-7,34,7,8,15],[7,34,7,8,21],
 [-35,0,7,8,17],[35,0,7,8,22]
];
buildings.forEach((b,i)=>makeBuilding(...b,i));

// 路地の低い障害物
const coverPositions=[
 [-16,-8,3,2,1.5],[16,8,3,2,1.5],
 [-17,12,2,3,1.8],[17,-12,2,3,1.8],
 [-7,-18,3,2,1.5],[7,18,3,2,1.5],
 [-10,5,2,2,1.2],[10,-5,2,2,1.2]
];
for(const [x,z,w,d,h] of coverPositions){
 box(w,h,d,mats.dark,x,h/2,z,true);
 box(w,.12,.12,mats.blue,x,h+.08,z-d/2);
}

// 屋上へ登れる階段・低い台
function stairs(x,z,dir=1){
 for(let i=0;i<5;i++){
  const h=.35*(i+1);
  const xx=x+(dir===1?i*.8:-i*.8);
  box(1.2,h,2,mats.sidewalk,xx,h/2,z,true);
 }
}
stairs(-14,-13,1);
stairs(14,13,-1);
stairs(-13,14,1);
stairs(13,-14,-1);

// 街灯
function streetlight(x,z){
 box(.15,4,.15,mats.dark,x,2,z,true);
 box(.9,.12,.3,mats.blue,x,4,z);
 const light=new THREE.PointLight(0x29dfff,2,9);
 light.position.set(x,3.8,z);scene.add(light);
}
for(let x=-20;x<=20;x+=10){
 streetlight(x,-20);
 streetlight(x,20);
}
for(let z=-10;z<=10;z+=10){
 streetlight(-20,z);
 streetlight(20,z);
}

// 公園の植え込み
function tree(x,z){
 box(1.8,.65,1.8,mats.dark,x,.32,z);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.6,7),
  new THREE.MeshStandardMaterial({color:0x76503c}));
 trunk.position.set(x,1.2,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.1,8,7),
  new THREE.MeshStandardMaterial({color:0x238c71,roughness:1}));
 crown.position.set(x,2.2,z);crown.castShadow=true;scene.add(crown);
}
for(const [x,z] of [[-5,-5],[-5,5],[5,-5],[5,5]]) tree(x,z);

// プレイヤーとCPU
function character(color,glow,x,z){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,4,8),
  new THREE.MeshStandardMaterial({color,emissive:glow,emissiveIntensity:.35}));
 body.position.y=1.05;body.castShadow=true;group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),
  new THREE.MeshStandardMaterial({color:0xe0f5ff,emissive:glow,emissiveIntensity:.3}));
 head.position.y=1.9;head.castShadow=true;group.add(head);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.65,.06,6,24),
  new THREE.MeshStandardMaterial({color:glow,emissive:glow,emissiveIntensity:2}));
 ring.rotation.x=Math.PI/2;ring.position.y=.1;group.add(ring);
 group.position.set(x,0,z);scene.add(group);
 return group;
}
const player=character(0x167dff,0x00cfff,0,5);
const cpu=character(0xff316b,0xff1760,0,-15);

// クリスタル
function spawnCrystal(x,z){
 const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.55),
  new THREE.MeshStandardMaterial({color:0x55ffdb,emissive:0x00cfa3,emissiveIntensity:2,metalness:.3,roughness:.2}));
 gem.position.set(x,.9,z);gem.castShadow=true;scene.add(gem);
 pickups.push({mesh:gem,active:true,x,z});
}
const crystalSpots=[
 [-15,-5],[-10,10],[10,10],[15,-5],[0,15],
 [0,-15],[-18,8],[18,-8],[-8,-18],[8,18],
 [-20,0],[20,0],[0,20],[0,-20]
];
crystalSpots.forEach(p=>spawnCrystal(...p));

// 壁の外に出ないようにする
function clampPos(obj){
 obj.position.x=THREE.MathUtils.clamp(obj.position.x,-43,43);
 obj.position.z=THREE.MathUtils.clamp(obj.position.z,-43,43);
}

// 円形キャラクターと箱の簡易衝突判定
function hitsSolid(x,z,r=.55){
 for(const s of solids){
  const p=s.mesh.position;
  if(p.y-s.h/2>1.7) continue;
  if(Math.abs(x-p.x)<s.w/2+r && Math.abs(z-p.z)<s.d/2+r) return true;
 }
 return false;
}
function moveWithCollision(obj,dx,dz){
 const nx=obj.position.x+dx,nz=obj.position.z+dz;
 if(!hitsSolid(nx,obj.position.z)) obj.position.x=nx;
 if(!hitsSolid(obj.position.x,nz)) obj.position.z=nz;
 clampPos(obj);
}

// タグパルス（ゲーム内の非現実的な光の弾）
function fire(from,to,isPlayer){
 const now=performance.now();
 if(isPlayer && now-lastShot<380)return;
 if(!isPlayer && now-cpuLastShot<1000)return;
 if(isPlayer)lastShot=now;else cpuLastShot=now;

 const start=from.position.clone();
 start.y+=1.25;
 const target=to.position.clone();target.y+=1.1;
 const direction=target.sub(start).normalize();
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),
  new THREE.MeshBasicMaterial({color:isPlayer?0x50f7ff:0xff4f88}));
 mesh.position.copy(start);scene.add(mesh);
 pulses.push({mesh,dir:direction,owner:isPlayer?'player':'cpu',life:0});
}
function updatePulses(dt){
 for(let i=pulses.length-1;i>=0;i--){
  const p=pulses[i];p.life+=dt;
  p.mesh.position.addScaledVector(p.dir,dt*25);
  const target=p.owner==='player'?cpu:player;
  if(p.mesh.position.distanceTo(new THREE.Vector3(target.position.x,1.1,target.position.z))<1.1){
   if(p.owner==='player')cpuHP=Math.max(0,cpuHP-25);
   else playerHP=Math.max(0,playerHP-10);
   scene.remove(p.mesh);pulses.splice(i,1);continue;
  }
  if(p.life>2.5){scene.remove(p.mesh);pulses.splice(i,1);}
 }
}

// 操作
document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='Space' && gameStarted && onGround){
  jumpV=8;onGround=false;
 }
 if(e.code==='KeyE' && gameStarted && !gameOver)fire(player,cpu,true);
});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousedown',()=>{
 if(gameStarted && !gameOver && document.pointerLockElement===renderer.domElement)fire(player,cpu,true);
});
renderer.domElement.addEventListener('click',()=>{
 if(gameStarted && !gameOver && document.pointerLockElement!==renderer.domElement)
  renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange',()=>{
 locked=document.pointerLockElement===renderer.domElement;
});

// カメラの向き
let yaw=0,pitch=0;
document.addEventListener('mousemove',e=>{
 if(!locked||!gameStarted||gameOver)return;
 yaw-=e.movementX*.0025;
 pitch-=e.movementY*.002;
 pitch=THREE.MathUtils.clamp(pitch,-1.15,1.15);
});

// CPUが追いかける
let cpuMoveTimer=0;
function updateCPU(dt){
 const dx=player.position.x-cpu.position.x;
 const dz=player.position.z-cpu.position.z;
 const dist=Math.hypot(dx,dz);
 if(dist>2.8){
  const speed=dist>12?3.5:2.4;
  moveWithCollision(cpu,dx/dist*speed*dt,dz/dist*speed*dt);
 }
 cpu.rotation.y=Math.atan2(dx,dz);
 cpuMoveTimer+=dt;
 if(dist<22 && cpuMoveTimer>1.1){
  fire(cpu,player,false);cpuMoveTimer=0;
 }
}

// UI
function updateHUD(){
 document.getElementById('playerFill').style.width=playerHP+'%';
 document.getElementById('cpuFill').style.width=cpuHP+'%';
 document.getElementById('playerHP').textContent=`HP ${playerHP} / 100`;
 document.getElementById('cpuHP').textContent=`HP ${cpuHP} / 100`;
 document.getElementById('playerScore').textContent=`クリスタル ${playerScore} / 10`;
 document.getElementById('cpuScore').textContent=`クリスタル ${cpuScore} / 10`;
}
function endGame(winner){
 gameOver=true;
 document.exitPointerLock?.();
 document.getElementById('overlay').style.display='flex';
 document.querySelector('#overlay h1').innerHTML=winner==='player'?'YOU WIN! 🏆':winner==='cpu'?'CPU WIN':'DRAW';
 document.querySelector('#overlay .card p').textContent=
  winner==='player'?'都市のバトルに勝利した！':winner==='cpu'?'もう一度挑戦しよう！':'引き分け！';
 document.getElementById('start').textContent='もう一度プレイ';
}
function checkEnd(){
 if(playerHP<=0)endGame('cpu');
 else if(cpuHP<=0)endGame('player');
 else if(playerScore>=10 && cpuScore>=10)endGame('draw');
 else if(playerScore>=10)endGame('player');
 else if(cpuScore>=10)endGame('cpu');
}

// メインループ
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=performance.now()*.001;

 for(const p of pickups){
  if(p.active){
   p.mesh.rotation.y+=dt*1.5;
   p.mesh.position.y=.9+Math.sin(t*2+p.x)*.18;
  }
 }
 plazaRing.rotation.z+=dt*.2;

 if(gameStarted&&!gameOver){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let dx=0,dz=0;
  if(keys.KeyW||keys.ArrowUp){dx+=forward.x;dz+=forward.z;}
  if(keys.KeyS||keys.ArrowDown){dx-=forward.x;dz-=forward.z;}
  if(keys.KeyD||keys.ArrowRight){dx+=right.x;dz+=right.z;}
  if(keys.KeyA||keys.ArrowLeft){dx-=right.x;dz-=right.z;}
  const len=Math.hypot(dx,dz);
  if(len>0)moveWithCollision(player,dx/len*8*dt,dz/len*8*dt);

  // ジャンプ
  if(!onGround){
   player.position.y+=jumpV*dt;
   jumpV-=20*dt;
   if(player.position.y<=0){player.position.y=0;jumpV=0;onGround=true;}
  }

  player.rotation.y=yaw;
  updateCPU(dt);
  updatePulses(dt);

  for(const p of pickups){
   if(!p.active)continue;
   if(Math.hypot(player.position.x-p.x,player.position.z-p.z)<1.5){
    p.active=false;scene.remove(p.mesh);playerScore++;
   }else if(Math.hypot(cpu.position.x-p.x,cpu.position.z-p.z)<1.5){
    p.active=false;scene.remove(p.mesh);cpuScore++;
   }
  }
  updateHUD();checkEnd();
 }

 // 一人称カメラ
 camera.position.set(player.position.x,player.position.y+1.55,player.position.z);
 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 // CPUの位置を見失いにくいように上部マーカーを表示
 renderer.render(scene,camera);
}
animate();

document.getElementById('start').addEventListener('click',()=>{
 if(gameOver){
  location.reload();
  return;
 }
 gameStarted=true;
 document.getElementById('overlay').style.display='none';
 document.getElementById('message').textContent='FIGHT!';
 renderer.domElement.requestPointerLock?.();
 setTimeout(()=>{
  const msg=document.getElementById('message');
  if(msg.textContent==='FIGHT!')msg.textContent='';
 },1800);
});

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

</body>
</html>
